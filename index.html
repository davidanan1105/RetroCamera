<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Camera</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Shadows+Into+Light&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaQ3vN8xmKQEiC5EvhczHxVh9Yx8RJWb1x1o1t4bm/FYnGV8eK3opgDdGztqKqRR3YKHyCuXapnwMaijFvS5g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root {
      --cream: #f4f0e6;
      --cream-deep: #e7e0d4;
      --dark: #222;
      --accent: #ff6f5e;
      --grey: #d6d6d6;
      --shadow: 0 14px 28px rgba(0, 0, 0, 0.2), 0 10px 10px rgba(0, 0, 0, 0.14);
      --camera-shell: linear-gradient(145deg, #fbf8f1, #e6dfd3);
      --camera-shadow: 18px 18px 36px rgba(0, 0, 0, 0.22), -10px -10px 24px rgba(255, 255, 255, 0.7);
      --card-bg: #fdfbf7;
      --card-border: rgba(0, 0, 0, 0.06);
      --card-shadow: 0 18px 38px rgba(0, 0, 0, 0.16);
      --card-shadow-hover: 0 22px 48px rgba(0, 0, 0, 0.22);
      --card-caption: #363636;
      --card-date: #7a7a7a;
      --share-border: rgba(0, 0, 0, 0.08);
      --share-bg: rgba(255, 255, 255, 0.85);
      --share-bg-hover: rgba(255, 255, 255, 0.95);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle, #dcdcdc 1px, transparent 1px), #f3f3f3;
      background-size: 22px 22px;
      min-height: 100vh;
      color: var(--dark);
      overflow: hidden;
    }
    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 40px;
      padding: 32px 40px 48px 40px;
    }
    header {
      position: absolute;
      top: 24px;
      right: 32px;
      display: flex;
      gap: 12px;
      z-index: 20;
    }
    .pill-btn {
      padding: 12px 22px;
      border-radius: 999px;
      background: white;
      border: 2px solid #c9c9c9;
      box-shadow: 0 10px 20px rgba(0,0,0,0.12);
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .pill-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .pill-btn:active { transform: translateY(0); }
    .camera-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .camera-container {
      position: relative;
      width: min(540px, 84vw);
      height: min(560px, 88vw);
      border-radius: 40px;
      background: var(--camera-shell);
      box-shadow: var(--camera-shadow), inset -12px -12px 24px rgba(0, 0, 0, 0.05), inset 12px 12px 24px rgba(255, 255, 255, 0.65);
      padding: 36px 34px 44px;
      overflow: hidden;
    }
    .camera {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 32px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.52), rgba(0, 0, 0, 0));
      box-shadow: inset 8px 8px 18px rgba(0, 0, 0, 0.07), inset -10px -10px 22px rgba(255, 255, 255, 0.65);
    }
    .camera-top-strip {
      position: absolute;
      top: 26px; left: 26px; right: 26px;
      height: 88px;
      background: linear-gradient(90deg, #ff914d, #ffd96b, #a6e7ff, #a08bff);
      border-radius: 24px;
      box-shadow: 0 14px 20px rgba(0,0,0,0.15), inset 0 4px 10px rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
    }
    .viewfinder {
      width: 74px;
      height: 46px;
      background: #0d0d0d;
      border-radius: 14px;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.25), 0 8px 16px rgba(0,0,0,0.18);
      border: 2px solid rgba(255,255,255,0.18);
    }
    .flash {
      width: 88px;
      height: 46px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), rgba(161, 216, 241, 0.8));
      border-radius: 16px;
      box-shadow: inset 0 0 18px rgba(117, 196, 230, 0.65), 0 8px 16px rgba(0,0,0,0.16);
      border: 2px solid rgba(110, 180, 216, 0.4);
    }
    .lens {
      position: relative;
      width: 260px; height: 260px;
      margin: 120px auto 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2f2f2f, #060606 65%);
      box-shadow:
        0 28px 40px rgba(0,0,0,0.35),
        inset 0 -10px 18px rgba(0,0,0,0.45),
        inset 0 12px 20px rgba(255,255,255,0.08);
      border: 18px solid #0d0d0d;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lens::before {
      content: '';
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.05), rgba(0,0,0,0.35));
      pointer-events: none;
    }
    .lens::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 28% 28%, rgba(255,255,255,0.35), rgba(255,255,255,0) 55%);
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .lens video, .lens .fallback {
      width: calc(100% - 38px);
      height: calc(100% - 38px);
      object-fit: cover;
      border-radius: 50%;
      position: absolute; top: 19px; left: 19px;
      box-shadow: inset 0 8px 16px rgba(0,0,0,0.4);
    }
    .fallback {
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.2), rgba(0,0,0,0.85));
      font-weight: 600;
    }
    .shutter {
      position: absolute;
      bottom: 40px; right: 46px;
      width: 112px; height: 112px;
      background: linear-gradient(160deg, #ffb199, #ff6f61);
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.7);
      box-shadow:
        0 20px 30px rgba(0,0,0,0.22),
        inset 0 8px 12px rgba(255,255,255,0.25),
        inset 0 -10px 16px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .shutter:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 24px 34px rgba(0,0,0,0.26), inset 0 10px 14px rgba(255,255,255,0.3), inset 0 -12px 16px rgba(0,0,0,0.2); }
    .shutter:active { transform: scale(0.98); }
    .stand {
      position: absolute;
      left: -40px; right: -40px;
      bottom: -50px;
      height: 120px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.18), transparent 70%);
      filter: blur(18px);
      opacity: 0.7;
      z-index: -1;
    }
    .board {
      position: relative;
      background: linear-gradient(180deg, #f4f4f4, #e8e8e8);
      border: 2px dashed #d0d0d0;
      border-radius: 20px;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .board::after {
      content: 'Snap a moment';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #b5b5b5;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .board.has-content::after { display: none; }
    .polaroid,
    .polaroid-card {
      position: absolute;
      width: 220px;
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      padding: 14px 14px 20px;
      cursor: grab;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
    }
    .polaroid:hover,
    .polaroid-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow-hover); }
    .polaroid.shared,
    .polaroid-card.shared { box-shadow: 0 20px 44px rgba(255,111,94,0.3); }
    .polaroid.dragging,
    .polaroid-card.dragging { cursor: grabbing; box-shadow: var(--card-shadow-hover); }
    .polaroid img,
    .polaroid-card img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      background: linear-gradient(180deg, #f0f0f0, #e3e3e3);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
    }
    .caption {
      font-family: 'Shadows Into Light', cursive;
      color: var(--card-caption);
      font-size: 18px;
      margin: 12px 6px 4px;
      min-height: 24px;
      letter-spacing: 0.02em;
    }
    .caption input {
      font-family: 'Shadows Into Light', cursive;
      font-size: 18px;
      width: 100%;
      border: none;
      border-bottom: 1px solid #cfcfcf;
      outline: none;
      background: #fffaf0;
      padding: 4px 2px;
      border-radius: 6px;
    }
    .date {
      font-size: 12px;
      color: var(--card-date);
      letter-spacing: 0.08em;
      margin-left: 6px;
      font-weight: 600;
    }
    .polaroid .actions,
    .polaroid-card .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }
    .tiny-btn {
      background: var(--share-bg);
      border: 1px solid var(--share-border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .tiny-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(0,0,0,0.12); background: var(--share-bg-hover); }

    .footer-left {
      position: absolute;
      bottom: 18px; left: 24px;
      z-index: 15;
    }
    .footer-right {
      position: absolute;
      bottom: 18px; right: 24px;
      color: #707070;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    .ghost-btn {
      background: rgba(255,255,255,0.8);
      border: 1px solid #cfcfcf;
      border-radius: 14px;
      padding: 8px 14px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.1);
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .ghost-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: white;
      border-radius: 16px;
      width: min(420px, 90vw);
      padding: 26px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .modal h3 { margin-top: 0; }
    .modal .close-btn {
      margin-top: 16px;
      padding: 10px 16px;
      border-radius: 12px;
      background: #1f1f1f;
      color: white;
      border: none;
      cursor: pointer;
    }
    @media (max-width: 980px) {
      body { overflow-y: auto; }
      .page { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
      .board { min-height: 460px; }
      .camera-container { margin-top: 40px; }
      header { position: fixed; }
    }
  </style>
</head>
<body>
  <header>
    <button class="pill-btn" id="downloadBtn">DOWNLOAD</button>
    <button class="pill-btn" id="resetBtn">RESET</button>
  </header>
  <div class="page">
    <div class="camera-area">
      <div class="camera-container">
        <div class="camera">
          <div class="camera-top-strip">
            <div class="viewfinder"></div>
            <div class="flash"></div>
          </div>
          <div class="lens" id="lens">
            <video id="video" autoplay playsinline muted></video>
            <div class="fallback" id="fallback">Allow webcam to see live preview.</div>
          </div>
          <div class="shutter" id="shutter"></div>
          <div class="stand"></div>
        </div>
      </div>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div class="footer-left">
    <button class="ghost-btn" id="galleryBtn">View Public Pinboard Gallery</button>
  </div>
  <div class="footer-right">Use Once to capture your day through everyone's eyes</div>

  <canvas id="captureCanvas" width="640" height="480" style="display:none;"></canvas>

  <div class="modal-backdrop" id="galleryModal">
    <div class="modal">
      <h3>Public Pinboard Gallery</h3>
      <p>This is a demo gallery. In the real app, we would show shared photos here.</p>
      <button class="close-btn" data-close="galleryModal">Close</button>
    </div>
  </div>

  <div class="modal-backdrop" id="shareModal">
    <div class="modal">
      <h3>Share to Public Pinboard?</h3>
      <p>There's no backend here, but imagine your snap being shared with the world.</p>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
        <button class="pill-btn" id="confirmShare">Share</button>
        <button class="pill-btn" data-close="shareModal">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const fallback = document.getElementById('fallback');
    const shutter = document.getElementById('shutter');
    const lens = document.getElementById('lens');
    const canvas = document.getElementById('captureCanvas');
    const board = document.getElementById('board');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const galleryBtn = document.getElementById('galleryBtn');
    const galleryModal = document.getElementById('galleryModal');
    const shareModal = document.getElementById('shareModal');
    const confirmShare = document.getElementById('confirmShare');

    let currentStream = null;
    let zIndexCounter = 10;
    let activeShareCard = null;

    // Webcam setup
    async function initWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        currentStream = stream;
        video.srcObject = stream;
        video.onloadedmetadata = () => video.play();
        fallback.style.display = 'none';
      } catch (err) {
        console.error('Webcam error', err);
        fallback.textContent = 'Webcam not available. Grant permission to preview.';
        fallback.style.display = 'flex';
      }
    }
    initWebcam();

    // Capture logic
    function captureFrame() {
      if (!video.videoWidth) return null;
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/png');
    }

    function formatToday() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${d.getFullYear()}/${mm}/${dd}`;
    }

    function createPolaroid(imgSrc) {
      const card = document.createElement('div');
      card.className = 'polaroid polaroid-card';
      const img = document.createElement('img');
      img.src = imgSrc;

      const caption = document.createElement('div');
      caption.className = 'caption';
      caption.textContent = 'MAY I MEET YOU';

      const date = document.createElement('div');
      date.className = 'date';
      date.textContent = formatToday();

      const actions = document.createElement('div');
      actions.className = 'actions';
      const shareBtn = document.createElement('button');
      shareBtn.className = 'tiny-btn';
      shareBtn.textContent = 'Share';
      actions.appendChild(shareBtn);

      card.appendChild(img);
      card.appendChild(caption);
      card.appendChild(date);
      card.appendChild(actions);

      // Random rotation and offset
      const rotation = (Math.random() * 16) - 8;
      const availableX = Math.max(40, board.clientWidth - 220);
      const availableY = Math.max(60, board.clientHeight - 280);
      const offsetX = 20 + Math.random() * availableX;
      const offsetY = 20 + Math.random() * availableY;
      card.style.transform = `rotate(${rotation}deg)`;
      card.style.left = `${offsetX}px`;
      card.style.top = `${offsetY}px`;
      card.style.zIndex = ++zIndexCounter;

      enableDragging(card);
      enableCaptionEditing(caption);
      shareBtn.addEventListener('click', () => {
        activeShareCard = card;
        openModal(shareModal);
      });

      board.appendChild(card);
      board.classList.add('has-content');
    }

    function enableCaptionEditing(captionEl) {
      captionEl.addEventListener('click', () => {
        const currentText = captionEl.textContent;
        const input = document.createElement('input');
        input.value = currentText;
        captionEl.textContent = '';
        captionEl.appendChild(input);
        input.focus();
        const commit = () => {
          captionEl.textContent = input.value || 'MAY I MEET YOU';
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') input.blur();
          if (e.key === 'Escape') { input.value = currentText; input.blur(); }
        });
      });
    }

    // Drag and drop
    function enableDragging(card) {
      let offsetX = 0, offsetY = 0, dragging = false;
      const startDrag = (e) => {
        dragging = true;
        card.classList.add('dragging');
        card.style.zIndex = ++zIndexCounter;
        const rect = card.getBoundingClientRect();
        const boardRect = board.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        e.preventDefault();
      };
      const onMove = (e) => {
        if (!dragging) return;
        const boardRect = board.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - boardRect.left - offsetX;
        const y = clientY - boardRect.top - offsetY;
        card.style.left = `${Math.min(boardRect.width - card.offsetWidth, Math.max(0, x))}px`;
        card.style.top = `${Math.min(boardRect.height - card.offsetHeight, Math.max(0, y))}px`;
      };
      const endDrag = () => { dragging = false; card.classList.remove('dragging'); };
      card.addEventListener('mousedown', startDrag);
      card.addEventListener('touchstart', startDrag);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('touchmove', onMove);
      window.addEventListener('mouseup', endDrag);
      window.addEventListener('touchend', endDrag);
    }

    // Download board
    downloadBtn.addEventListener('click', async () => {
      if (!board.children.length) return;
      const canvasOut = await html2canvas(board, { backgroundColor: null });
      const link = document.createElement('a');
      link.download = 'retro-camera.png';
      link.href = canvasOut.toDataURL('image/png');
      link.click();
    });

    // Reset board
    resetBtn.addEventListener('click', () => {
      board.innerHTML = '';
      board.classList.remove('has-content');
    });

    // Capture events
    const takePhoto = () => {
      const src = captureFrame();
      if (src) createPolaroid(src);
    };
    shutter.addEventListener('click', takePhoto);
    lens.addEventListener('click', takePhoto);

    // Modals
    function openModal(modal) { modal.classList.add('active'); }
    function closeModal(modal) { modal.classList.remove('active'); }
    galleryBtn.addEventListener('click', () => openModal(galleryModal));
    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => closeModal(document.getElementById(btn.dataset.close)));
    });
    [galleryModal, shareModal].forEach(modal => {
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(modal); });
    });
    confirmShare.addEventListener('click', () => {
      if (activeShareCard) {
        activeShareCard.classList.add('shared');
        setTimeout(() => activeShareCard.classList.remove('shared'), 600);
      }
      closeModal(shareModal);
    });

    // Accessibility hint
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ') { e.preventDefault(); takePhoto(); }
    });
  </script>
</body>
</html>
